<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Background Rect (Transparent by default, adapts to theme) -->
  <g fill="none" stroke="#f4f4f5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tangent Handle Lines & Control Points -->
    <g opacity="0.85" stroke-width="1.75">
      <!-- Top Tangent -->
      <line x1="24" y1="16" x2="64" y2="16" />
      <circle cx="24" cy="16" r="3" fill="#f4f4f5" stroke="none" />
      <circle cx="64" cy="16" r="3" fill="#f4f4f5" stroke="none" />

      <!-- Left Tangent -->
      <line x1="20" y1="20" x2="20" y2="60" />
      <circle cx="20" cy="20" r="3" fill="#f4f4f5" stroke="none" />
      <circle cx="20" cy="60" r="3" fill="#f4f4f5" stroke="none" />

      <!-- Right Tangent -->
      <line x1="68" y1="20" x2="68" y2="40" />
      <circle cx="68" cy="20" r="3" fill="#f4f4f5" stroke="none" />

      <!-- Bottom Tangent -->
      <line x1="28" y1="64" x2="44" y2="64" />
      <circle cx="28" cy="64" r="3" fill="#f4f4f5" stroke="none" />
    </g>

    <!-- Loupe Handle (Stem) -->
    <line x1="60" y1="56" x2="82" y2="78" stroke-width="8" />

    <!-- Main Lens Rim (Bézier Circle) -->
    <circle cx="44" cy="40" r="24" stroke-width="5" />

    <!-- Optical Reflection Glint Arc -->
    <path d="M 32 28 A 16 16 0 0 1 56 28" stroke-width="2.75" opacity="0.9" />

    <!-- Cardinal Anchor Nodes (Vector Squares) -->
    <rect x="41" y="13" width="6" height="6" fill="#f4f4f5" stroke="#09090b" stroke-width="1" />
    <rect x="17" y="37" width="6" height="6" fill="#f4f4f5" stroke="#09090b" stroke-width="1" />
    <rect x="65" y="37" width="6" height="6" fill="#f4f4f5" stroke="#09090b" stroke-width="1" />
    <rect x="41" y="61" width="6" height="6" fill="#f4f4f5" stroke="#09090b" stroke-width="1" />
  </g>
</svg>
